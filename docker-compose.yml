services:
  postgres:
    image: postgres:16-alpine
    container_name: svg-animator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: svganimator
      POSTGRES_PASSWORD: svganimator
      POSTGRES_DB: svganimator
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svganimator -d svganimator"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: svg-animator-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
